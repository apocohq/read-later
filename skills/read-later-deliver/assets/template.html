<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Read later</title>
<style>
:root{
  --bg:#efeae2;--bg2:#e6e0d6;--paper:#fbf9f5;--ink:#1f1d1a;--ink2:#5f5a52;--ink3:#8f887c;--line:#d8d1c5;--accent:#8a4b2f;--accent2:#c48a5a;
  --shadow:0 1px 2px rgba(40,30,20,.12),0 10px 24px -12px rgba(40,30,20,.35);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171614;--bg2:#1f1d1a;--paper:#242220;--ink:#ece7df;--ink2:#b5ada1;--ink3:#7f786d;--line:#37332e;--accent:#d9a06f;--accent2:#b07a4e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -12px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
a{color:inherit}
main{max-width:1180px;margin:0 auto;padding:36px 28px 90px}

/* header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
header h1{font-size:30px;margin:0;letter-spacing:-.01em;font-weight:600}
header .sub{color:var(--ink2);font-size:13px;margin-top:4px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px;font-size:11px}
.chip.more{border-style:dashed}
.controls .topics{display:contents}
.chip:focus-visible,.tile:focus-visible,.close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;min-width:180px}

/* needs attention */
.attention[hidden]{display:none}
.attention{border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-left:4px solid var(--accent);border-radius:8px;padding:12px 16px;margin:0 0 8px;display:grid;gap:8px;background:color-mix(in srgb,var(--accent) 6%,var(--paper))}
.attention h2{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;gap:10px;align-items:baseline}
.attention h2 small{letter-spacing:0;text-transform:none;color:var(--ink3);font-weight:400}
.attention ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.attention li{font-size:13.5px;line-height:1.45;display:flex;gap:6px 0;flex-wrap:wrap;align-items:baseline}
.attention li>*+*::before{content:"";display:inline-block;width:1px;height:11px;background:var(--line);margin:0 10px;vertical-align:-1px}
.attention li .t{font-weight:600}
.attention li .why{color:var(--ink2)}
.attention li a{color:var(--accent);text-decoration:none}.attention li a:hover{text-decoration:underline}
.attention .hint{margin:0;font-size:12.5px;color:var(--ink3)}

/* shelves */
.shelf{margin-top:34px}
.shelf h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 14px;display:flex;gap:10px;align-items:baseline}
.shelf h2 small{letter-spacing:0;text-transform:none;color:var(--ink3);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px 20px;padding-bottom:22px;position:relative}
.grid::after{content:"";position:absolute;left:-8px;right:-8px;bottom:0;height:8px;background:var(--bg2);border-radius:4px;box-shadow:inset 0 2px 3px rgba(0,0,0,.08)}
.grid.hidden{display:none}
.empty{color:var(--ink3);font-style:italic;font-size:14px;padding:8px 0 22px}

/* tile = book */
.tile{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;gap:9px;width:100%}
.cover{position:relative;aspect-ratio:2/3;border-radius:3px 8px 8px 3px;box-shadow:var(--shadow);overflow:hidden;color:#fff;padding:14px 14px 12px 18px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(160deg,var(--c1) 0%,var(--c2) 100%);transition:transform .18s ease,box-shadow .18s ease}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.08));}
.cover::after{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.5) 0 1px,rgba(0,0,0,.15) 1px 2px);opacity:.7}
.tile:hover .cover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 2px 3px rgba(40,30,20,.14),0 18px 30px -14px rgba(40,30,20,.5)}
.cover .head{display:grid;gap:5px;min-width:0}
.cover .kicker{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.92;display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
.cover .topic{font-size:13px;letter-spacing:.01em;opacity:.78;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.cover .kicker .cat{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover .kicker .pill{flex:none;background:#f2c14e;color:#222;border-radius:3px;padding:1px 6px;letter-spacing:.08em;font-weight:700}
.cover .badge{flex:none;font-size:16px;font-weight:700;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:3px 8px;line-height:1.2}
.cover .title{font-size:19px;line-height:1.22;font-weight:600;text-wrap:balance;text-shadow:0 1px 2px rgba(0,0,0,.25);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.cover .foot{font-size:11px;opacity:.95;display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.cover .mid{min-width:0}
.cover .src{font-size:16px;line-height:1.2;font-weight:500;opacity:.85;margin-bottom:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.under{display:flex;flex-direction:column;gap:6px;padding:0 2px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:10.5px;color:var(--ink3)}
.bars .v{font-variant-numeric:tabular-nums;color:var(--ink2);min-width:1.6em;text-align:right}
.bar{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:5px}
.bar i{display:block;background:var(--line);border-radius:1px}
.bar i.on{background:var(--ink2)}.bar.hw i.on{background:var(--accent)}.bar.gr i.on{background:var(--accent2)}

/* reader */
.reader{position:fixed;inset:0;background:rgba(20,16,12,.55);display:none;align-items:stretch;justify-content:flex-end;z-index:10}
.reader.open{display:flex}
.pane{width:min(820px,100%);background:var(--paper);height:100%;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.3);animation:slide .22s ease}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.pane .head{padding:26px 36px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:1;display:flex;gap:18px;align-items:flex-start}
.pane .head .mini{width:56px;flex:none;aspect-ratio:2/3;border-radius:2px 5px 5px 2px;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:var(--shadow)}
.pane .head h2{margin:0 0 6px;font-size:24px;line-height:1.2;font-weight:600;text-wrap:balance}
.pane .meta{font-size:13px;color:var(--ink2);display:flex;gap:6px 0;flex-wrap:wrap;align-items:center}
.pane .meta>*+*::before{content:"";display:inline-block;width:1px;height:12px;background:var(--line);margin:0 12px;vertical-align:-1px}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px}
.ibtn{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ibtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn[aria-pressed="true"]{background:color-mix(in srgb,var(--hl-c) 55%,transparent);border-color:color-mix(in srgb,var(--hl-c) 70%,var(--line));color:var(--ink)}
.swatches{display:inline-flex;gap:5px;align-items:center;margin:0 4px}
.sw{width:16px;height:16px;border-radius:999px;border:2px solid transparent;cursor:pointer;padding:0;background:color-mix(in srgb,var(--hl-c) 75%,var(--paper))}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.tools .chip{padding:4px 10px;font-size:12.5px}
.chip.danger{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));margin-left:auto}
.chip.danger:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pane .meta a{color:var(--accent);text-decoration:none}.pane .meta a:hover{text-decoration:underline}
.close{margin-left:auto;flex:none;border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1}
.pane .body{padding:22px 36px 60px;display:grid;gap:22px}
.tldr{font-size:17px;line-height:1.5;margin:0}
.claims{margin:0;padding-left:18px;color:var(--ink)}.claims li{margin:4px 0}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.score{border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.score .n .chev{color:var(--ink3);font-size:11px;margin-left:6px;transition:transform .15s}.score.open .n .chev{transform:rotate(180deg)}
.score p{display:none}.score.open p{display:block;margin-top:6px}
.score .n{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.score .n b{color:var(--ink);font-size:14px;letter-spacing:0}
.score .bar{margin:8px 0 0;height:6px}.score p{margin:0;font-size:13px;color:var(--ink2)}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink2)}
.divider{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;border-top:1px solid var(--line)}
.article{font-size:17px;line-height:1.65;max-width:66ch}
.article h1,.article h2,.article h3{line-height:1.25;margin:1.6em 0 .5em;font-weight:600}.article h1{font-size:26px}.article h2{font-size:22px}.article h3{font-size:18px}
.article p{margin:0 0 1em}.article img{max-width:100%;height:auto;border-radius:6px;margin:.4em 0}
.article a{color:var(--accent)}.article blockquote{margin:1em 0;padding:.2em 1em;border-left:3px solid var(--line);color:var(--ink2)}
.article pre{background:var(--bg2);padding:12px 14px;border-radius:6px;overflow:auto;font-size:13.5px}.article code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.article ul,.article ol{padding-left:1.4em}.article li{margin:.25em 0}.article .tbl{overflow-x:auto;margin:1em 0}.article table{border-collapse:collapse;font-size:14px;line-height:1.4}.article td,.article th{border:1px solid var(--line);padding:5px 9px;vertical-align:top}.article th{text-align:left;background:var(--bg2);font-weight:600}
.article hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}
.note{font-size:12.5px;color:var(--ink3)}

/* highlights */
.pane{position:relative}
.hls{display:grid;gap:10px}
.hls .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hls .row .n{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-right:auto}
.hls .row .n b{color:var(--ink);letter-spacing:0;font-size:14px}
.hls ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hls li{font-size:14px;line-height:1.45;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.hls li .q{border-left:3px solid color-mix(in srgb,var(--hl-c) 80%,var(--ink3));padding-left:10px;color:var(--ink);cursor:pointer}
.hls li .q:hover{color:var(--accent)}
.hls li .q .nt{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.hls li .q.orphan{border-left-color:var(--line);color:var(--ink3)}
.hls li .x{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
.hls li .x:hover{color:var(--accent)}
.hls .hint{font-size:12.5px;color:var(--ink3);margin:0}
.hls .warn{font-size:12.5px;color:var(--accent);margin:0}
.article.hl-on{cursor:text}
.article.hl-on ::selection{background:color-mix(in srgb,var(--accent2) 55%,transparent)}
/* highlight colors: one variable, set per element by data-c; nothing here changes layout */
[data-c=yellow]{--hl-c:#f2d34d}[data-c=green]{--hl-c:#8fd18b}[data-c=blue]{--hl-c:#7fb8f0}[data-c=pink]{--hl-c:#f095bd}[data-c=orange]{--hl-c:#f3a95a}
mark.hl{background:color-mix(in srgb,var(--hl-c) 50%,transparent);color:inherit;padding:0;border:0;border-radius:0;cursor:pointer}
mark.hl.flash{outline:2px solid var(--accent);outline-offset:1px}
.pop{position:absolute;z-index:3;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px;display:grid;gap:6px;width:min(320px,calc(100% - 40px))}
.pop input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;width:100%}
.pop .row{display:flex;gap:6px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:20;box-shadow:var(--shadow);opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.copybox{display:grid;gap:6px}
.copybox textarea{width:100%;height:120px;font:12px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:8px}
@media (max-width:640px){main{padding:24px 16px 70px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 12px}.cover .title{font-size:16.5px}.pane .head,.pane .body{padding-left:20px;padding-right:20px}}
@media (prefers-reduced-motion:reduce){.pane{animation:none}.tile:hover .cover{transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 class="serif">Read later</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="controls" id="controls">
      <span class="topics" id="topics"></span>
      <input type="search" id="q" placeholder="Search title, topic, text" aria-label="Search">
    </div>
  </header>
  <section class="attention" id="attention" hidden></section>
  <section class="shelf" id="s-read_today"><h2>Tonight <small id="n-read_today"></small></h2><div class="grid"></div></section>
  <section class="shelf" id="s-read_next"><h2>Next <small id="n-read_next"></small></h2><div class="grid"></div></section>
  <section class="shelf" id="s-later"><h2>Later <small id="n-later"></small></h2><div class="grid"></div></section>
</main>

<div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="r-title">
  <div class="pane" id="pane"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const items = DATA.items || [];
  const HUES = {'ai-and-agents':[262,48],'engineering':[204,42],'product':[338,40],'business-and-strategy':[28,55],'leadership':[150,30],'research':[190,35],'news':[0,45],'personal':[95,30],'other':[220,10]};
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const domain = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch { return u; } };
  const colors = cat => { const [h,s] = HUES[cat] || HUES.other; return `--c1:hsl(${h} ${s}% 34%);--c2:hsl(${(h+18)%360} ${Math.max(20,s-10)}% 22%)`; };
  const slots = v => { const n = Math.round(Math.max(0, Math.min(10, Number(v)||0))); return Array.from({length:10}, (_,i) => `<i class="${i < n ? 'on' : ''}"></i>`).join(''); };
  const num = v => v == null ? '–' : (Number.isInteger(Number(v)) ? String(v) : Number(v).toFixed(1));
  // overall score: rank's priority, 0-10 (must-read can push it over, so clamp), two decimals
  const score10 = v => v == null ? '–' : Math.max(0, Math.min(10, Number(v))).toFixed(2);

  document.getElementById('sub').textContent = `${items.length} saved · generated ${(DATA.generatedAt||'').replace('T',' ').replace(/:\d\d(\.\d+)?Z$/,' UTC')}`;

  // what the reader has to look at themselves: fetch failures and analyses that keep failing
  (function(){
    const needs = DATA.attention || [], box = document.getElementById('attention');
    if (!needs.length) return;
    const why = n => n.kind === 'fetch' ? `could not fetch the article${n.attempts > 1 ? ` (${n.attempts} attempts)` : ''}` : `analysis failed: ${n.reason || ''}`;
    box.innerHTML = `<h2>Needs attention <small>${needs.length}</small></h2><ul>${needs.map(n => `<li><span class="t">${esc(n.title||n.url)}</span><span>${esc(domain(n.url))}</span><span class="why">${esc(why(n))}</span><a href="${esc(n.url)}" target="_blank" rel="noopener">Open original ↗</a></li>`).join('')}</ul>` +
      (needs.some(n => n.kind === 'fetch') ? '<p class="hint">Could not fetch: open the page, let it load fully, and save it again from the browser; or remove it from Read Later.</p>' : '');
    box.hidden = false;
  })();

  function tile(it){
    const b = document.createElement('button'); b.className = 'tile'; b.setAttribute('aria-label', it.title || it.url);
    b.innerHTML = `
      <div class="cover" style="${colors(it.category)}">
        <div class="head">
          <div class="kicker"><span class="cat">${esc(it.category||'')}</span>${it.mustRead ? '<span class="pill">must</span>' : ''}</div>
          ${it.topTopic ? `<div class="topic">${esc(it.topTopic)}</div>` : ''}
        </div>
        <div class="mid"><div class="src serif">${esc(domain(it.url))}</div><div class="title serif">${esc(it.title||it.url)}</div></div>
        <div class="foot"><span>${esc(it.minutes)} min${HL.current(it).length ? ' · '+HL.current(it).length+' ✎' : ''}</span><span class="badge" title="Overall score: half relevance, half quality; long reads lose a point, must-read gains three">${score10(it.priority)}</span></div>
      </div>
      <div class="under">
        <div class="bars">
          <span>relevance</span><div class="bar rl">${slots(it.relevance)}</div><span class="v">${num(it.relevance)}</span>
          <span>hard-won</span><div class="bar hw">${slots(it.hardWon&&it.hardWon.score)}</div><span class="v">${num(it.hardWon&&it.hardWon.score)}</span>
          <span>grounded</span><div class="bar gr">${slots(it.grounded&&it.grounded.score)}</div><span class="v">${num(it.grounded&&it.grounded.score)}</span>
        </div>
      </div>`;
    b.addEventListener('click', () => open(it));
    return b;
  }

  function render(filter, q){
    q = (q||'').trim().toLowerCase();
    for (const key of ['read_today','read_next','later']){
      const sec = document.getElementById('s-'+key), grid = sec.querySelector('.grid');
      grid.innerHTML = '';
      const rows = items.filter(it => it.bucket===key && (filter==='all' || (it.topics||[]).includes(filter)) && (!q || [it.title, it.tldr, (it.topics||[]).join(' '), it.category, it.markdown, HL.current(it).map(h => h.exact+' '+(h.note||'')).join(' ')].join(' ').toLowerCase().includes(q)));
      document.getElementById('n-'+key).textContent = rows.length ? `${rows.length}` : '';
      sec.style.display = (filter==='all' || rows.length) ? '' : 'none';
      if (!rows.length){ grid.insertAdjacentHTML('beforeend', `<div class="empty">${q ? 'No match.' : 'Nothing here.'}</div>`); continue; }
      rows.forEach(it => grid.appendChild(tile(it)));
    }
  }

  // --- minimal markdown -> html (headings, lists, quotes, code, images, links, emphasis) ---
  function md(src){
    const lines = (src||'').split('\n'); let out = [], para = [], list = null, code = null;
    const inline = s => esc(s)
      .replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, (m,a,u) => /^https?:\/\//.test(u) ? `<img alt="${a}" src="${u}" loading="lazy">` : '')
      .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (m,t,u) => /^https?:\/\//.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t)
      .replace(/`([^`]+)`/g, '<code>$1</code>')

    const all = DATA.topics || [], shown = moreTopics ? all : all.slice(0, TOPICS_SHOWN), rest = all.length - TOPICS_SHOWN;
    document.getElementById('topics').innerHTML = `<button class="chip" data-f="all" aria-pressed="${filter==='all'}">All</button>` +
      shown.map(t => `<button class="chip" data-f="${esc(t.label)}" aria-pressed="${filter===t.label}" title="relevance ${esc(t.weight)} · ${t.count} article${t.count===1?'':'s'}">${esc(t.label)}<span class="n">${t.count}</span></button>`).join('') +
      (rest > 0 ? `<button class="chip more" data-more="1" aria-expanded="${moreTopics}">${moreTopics ? 'Fewer' : `${rest} more`}</button>` : '');
  }
  document.getElementById('controls').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (b.dataset.more){ moreTopics = !moreTopics; renderTopics(); return; }
    filter = b.dataset.f; renderTopics();
    render(filter, document.getElementById('q').value);
  });
  renderTopics();
  document.getElementById('q').addEventListener('input', e => render(filter, e.target.value));
  render(filter, '');
  const want = decodeURIComponent(location.hash.slice(1)); const hit = want && items.find(i => i.id === want); if (hit) open(hit);
})();
</script>
</body>
</html>
